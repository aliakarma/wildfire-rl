# Run `pre-commit install` once, then hooks run on every commit.
# Critically: nbstripout prevents notebook OUTPUTS (and the multi-MB embedded
# images that bloated the original notebooks) from ever being committed.
# legacy_v1/ is a FROZEN archive (Phase 0, REMEDIATION_PLAN_V2) - hooks must
# never rewrite it.
exclude: ^legacy_v1/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=5000"]   # hard stop on accidental >5 MB commits
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
