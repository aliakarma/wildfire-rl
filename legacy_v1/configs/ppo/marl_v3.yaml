# PPO-V3 MARL Configuration — Phase 3 Coordination & True Stabilization
#
# Key changes vs V2:
#   1. Leakage-free containment reward tracking (agent-caused suppression only)
#   2. Bounded and balanced penalties (overlap penalty reduced to -0.05)
#   3. Amplified explore incentives (coverage weight increased to 2.0)
#   4. Dynamic offset generation for unique agent starting positions (bug fixed)

# --- PPO Hyperparameters ---
ppo:
  total_timesteps: 300000       # Default; overridden by CLI per team-size
  learning_rate: 0.0001         # Lower learning rate for training stability
  n_steps: 4096                 # Longer rollout buffers
  batch_size: 256
  n_epochs: 15                  # Optimization epochs per rollout
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.15              # Tight clipping policy
  ent_coef: 0.02                # Higher entropy coefficient
  vf_coef: 0.5
  max_grad_norm: 0.5
  n_envs: 1
  verbose: 0
  features_dim: 256
  cnn_pooling: true

# --- Environment ---
env:
  grid_size: 32
  max_steps: 200
  reward_mode: normalized
  randomize_ignition: false
  reward_v3:
    enabled: true
    spread_reduction_weight: 5.0
    frontier_blocking_weight: 1.0
    coverage_weight: 2.0
    overlap_penalty: -0.05
    containment_stability_weight: 1.0
    containment_streak_cap: 10
    suppression_threshold: 0.05

# --- Evaluation ---
eval:
  n_episodes: 20
  deterministic: true
  base_seed: 0
