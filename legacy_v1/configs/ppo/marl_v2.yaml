# PPO-V2 MARL Configuration — Phase 2.5 Recovery & Stabilization
#
# Key changes vs V1:
#   1. Higher ent_coef (0.02 default, sweep 0.005–0.05) to prevent entropy collapse
#   2. Lower learning rate (1e-4) for training stability
#   3. Longer rollouts (n_steps=4096) for better gradient estimates
#   4. Tighter clip range (0.15) for policy stability
#   5. V2 reward shaping with 5 new components enabled

# --- PPO Hyperparameters ---
ppo:
  total_timesteps: 300000       # Default; override per team-size
  learning_rate: 0.0001         # Lower than V1 (3e-4) for stability
  n_steps: 4096                 # Longer rollouts (V1: 2048)
  batch_size: 256
  n_epochs: 15                  # More optimization per rollout (V1: 10)
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.15              # Tighter clipping (V1: 0.2)
  ent_coef: 0.02                # Higher entropy bonus (V1: 0.01)
  vf_coef: 0.5
  max_grad_norm: 0.5
  n_envs: 1
  verbose: 0
  features_dim: 256
  cnn_pooling: true

# --- Environment ---
env:
  grid_size: 32
  max_steps: 200
  reward_mode: normalized
  randomize_ignition: false
  reward_v2:
    enabled: true
    spread_reduction_weight: 1.0
    frontier_blocking_weight: 3.0
    coverage_weight: 0.5
    overlap_penalty: -2.0
    containment_stability_weight: 0.5
    containment_streak_cap: 10

# --- Evaluation ---
eval:
  n_episodes: 20
  deterministic: true
  base_seed: 0

# --- Training budget per team size (used by Colab notebook) ---
# 3 agents:  300k steps
# 5 agents:  500k steps
# 10 agents: 1M steps
