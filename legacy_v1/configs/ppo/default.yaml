# PPO hyperparameters (identical across regions for clean domain-shift comparison).
ppo:
  policy: CnnPolicy
  total_timesteps: 100000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  n_envs: 1
  features_dim: 256
  cnn_pooling: true
