# Base configuration. Every field maps to wildfire_rl.config.Config and can be
# overridden by a more specific YAML (configs/experiment/*.yaml) or a --set dotlist.
# This file documents the defaults; the dataclasses in src/wildfire_rl/config.py are
# the authoritative schema.

seed: 0
seeds: [0, 1, 2, 3, 4]
experiment_name: default

region:
  name: saudi
  dir: saudi_eastern_province
  grid_size: 32

env:
  grid_size: 32
  max_steps: 200
  reward_mode: raw          # "raw" | "normalized"
  directional_wind: false
  randomize_ignition: false # set true for held-out scenario distributions

ppo:
  total_timesteps: 100000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 256
  gamma: 0.99
  ent_coef: 0.01
  features_dim: 256
  cnn_pooling: true

eval:
  n_episodes: 20
  deterministic: true
  base_seed: 0

metrics:
  burned_threshold: 0.5     # single canonical definition
