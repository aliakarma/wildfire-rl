# Ablation study: toggle dynamics components to measure their effect on final fire.
# Each variant overrides env.* ; run via scripts/run_ablation.py.
experiment_name: ablation
seeds: [0, 1, 2]

region:
  name: saudi
  dir: saudi_eastern_province
  grid_size: 32

ppo:
  total_timesteps: 50000
  cnn_pooling: true

eval:
  n_episodes: 10

metrics:
  burned_threshold: 0.5

# Variants are interpreted by scripts/run_ablation.py:
#   baseline        -> all dynamics on
#   no_wind         -> wind_coeff: 0.0
#   no_terrain      -> terrain_coeff: 0.0
#   no_suppression  -> suppression_factor: 1.0  (agent cannot extinguish)
#   dense_fuel      -> fuel_coeff: 0.30
