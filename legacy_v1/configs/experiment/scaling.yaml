# MARL cooperative scaling: how does containment change with team size?
#   scripts/train_marl.py --config configs/experiment/scaling.yaml
# NOTE: agent counts are trained with the SAME budget for a fair comparison
# (the original notebooks trained MARL for 20k vs 100k single-agent — not comparable).
experiment_name: marl_scaling
seeds: [0, 1, 2]

region:
  name: saudi
  dir: saudi_eastern_province
  grid_size: 32

env:
  max_steps: 200
  reward_mode: normalized   # fire fraction remaining; comparable across team sizes

ppo:
  total_timesteps: 100000   # matched budget across all agent counts
  cnn_pooling: true

marl:
  agent_counts: [1, 3, 5]

eval:
  n_episodes: 20

metrics:
  burned_threshold: 0.5
