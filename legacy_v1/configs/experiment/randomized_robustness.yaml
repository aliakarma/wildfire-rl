# Configuration for Phase 5 Robustness Experiments under Randomized Wildfire Scenarios
#
# Robustness Parameters:
#   1. Randomized starting fire locations and counts (asymmetric multi-fire)
#   2. Randomized wind magnitude and direction angles
#   3. Scaled fuel density maps globally
#   4. Dynamic spread rates scaling

experiment_name: randomized_robustness

env:
  grid_size: 32
  max_steps: 200
  reward_mode: normalized
  routing_strategy: nearest_fire
  reward_v3:
    enabled: true
    spread_reduction_weight: 5.0
    frontier_blocking_weight: 1.0
    coverage_weight: 2.0
    overlap_penalty: -0.05
    containment_stability_weight: 1.0
