# Configuration for Phase 6 Dynamic Wildfire Scenarios
#
# Dynamic Scenarios Configured:
#   - moving_wind: True (rotates wind direction)
#   - sector_collapse: True (Northeast sector collapses with multiple NE ignitions at step 30)
#   - multi_wave_ignitions: True (wave fires spawn at steps 50 & 100)
#   - fuel_corridor: True (drought corridor appears at step 60)
#   - asymmetric_overload: True (Northwest sector has faster spread rates)

experiment_name: phase6_dynamic

env:
  grid_size: 32
  max_steps: 200
  reward_mode: normalized
  routing_strategy: nearest_fire
  reward_v3:
    enabled: true
    spread_reduction_weight: 5.0
    frontier_blocking_weight: 1.0
    coverage_weight: 2.0
    overlap_penalty: -0.05
    containment_stability_weight: 1.0
  dynamic_scenarios:
    moving_wind: true
    sector_collapse: true
    multi_wave_ignitions: true
    fuel_corridor: true
    asymmetric_overload: true
