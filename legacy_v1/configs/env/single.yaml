# Single-agent environment dynamics (defaults preserve original notebook behavior).
env:
  grid_size: 32
  max_steps: 200
  base_spread: 0.01
  fuel_coeff: 0.15
  wind_coeff: 0.08
  terrain_coeff: 0.08
  spread_threshold: 0.2
  fire_increment: 0.12
  decay: 0.97
  extinguish_threshold: 0.02
  fuel_depletion: 0.003
  suppression_radius: 1
  suppression_factor: 0.2
  suppression_bonus: 2.0
  termination_fire_threshold: 0.1
  reward_mode: raw
  directional_wind: false
  randomize_ignition: false
