[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-marl"
version = "2.0.0a0"
description = "Decentralized multi-agent RL for wildfire suppression on validated fire physics (Cell2Fire), with critical-infrastructure protection and cross-regional transfer (Saudi Arabia <-> California)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ali Akarma" }]
keywords = [
    "multi-agent-rl", "marl", "wildfire", "cell2fire", "mappo", "qmix",
    "transfer-learning", "gymnasium", "pettingzoo", "geospatial",
    "remote-sensing", "domain-generalization", "benchmark",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime deps (deliberately light: the eval/reproducibility core + env APIs).
# Heavy training / geospatial stacks live in extras so CI and the ported-core tests
# stay fast. Exact pins for full experiments are recorded per-run in manifests.
dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=2.0,<3.0",
    "scipy>=1.10,<2.0",
    "matplotlib>=3.7,<4.0",
    "gymnasium>=0.29,<1.1",
    "pettingzoo>=1.24,<2.0",
    "omegaconf>=2.3,<3.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# MARL training stack (Phase 5+). The MARL library choice (MARLlib / epymarl /
# RLlib multi-agent) is finalized in Phase 5; RLlib is the pip-installable default.
marl = [
    "torch>=2.1,<3.0",
    "ray[rllib]>=2.10",
]
# Single-agent baselines (Phase 4): Maskable-PPO (Firehose-style) via SB3-contrib.
baselines = [
    "torch>=2.1,<3.0",
    "stable-baselines3>=2.2,<3.0",
    "sb3-contrib>=2.2,<3.0",
]
# Geospatial I/O (Phase 2): region tensors -> Cell2Fire landscapes. GDAL is
# provided through rasterio's binary wheels (or conda-forge, see environment-linux.yml).
geo = [
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "cdsapi>=0.6",
    "scikit-image>=0.21",
    "tifffile>=2023.1",
]
# Experiment tracking / model hosting (optional).
track = ["wandb>=0.16", "huggingface-hub>=0.20"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "black>=24.1",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "nbstripout>=0.7",
]

[project.urls]
Homepage = "https://github.com/aliakarma/wildfire-rl"
Repository = "https://github.com/aliakarma/wildfire-rl"
Issues = "https://github.com/aliakarma/wildfire-rl/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wildfire_marl = ["py.typed"]

# ----------------------------------------------------------------------------
# Tooling — legacy_v1/ is frozen and excluded everywhere.
# ----------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "legacy_v1/"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
extend-exclude = ["legacy_v1"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length handled by black

[tool.ruff.lint.isort]
known-first-party = ["wildfire_marl"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
packages = ["wildfire_marl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: end-to-end tests requiring optional deps",
]
