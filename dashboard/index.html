<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive results dashboard for an infrastructure-aware wildfire-coordination MARL benchmark. All values are generated from frozen artifacts."
    />
    <!-- Anonymity protocol (review channel): no author names, institutions, or repo links. -->
    <title>Wildfire-MARL Benchmark</title>
    <script>
      // Theme/locale bootstrap — runs before first paint so the wrong theme never
      // flashes. Shared URLs win over the stored preference (§5.3: ?region/lang/theme
      // make any exact view citable).
      (function () {
        var q = new URLSearchParams(
          (location.hash.split("?")[1] || "") + "&" + location.search.slice(1)
        );
        var t = q.get("theme") || localStorage.getItem("theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
        var l = q.get("lang") || localStorage.getItem("locale");
        if (l === "ar") {
          document.documentElement.lang = "ar";
          document.documentElement.dir = "rtl";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
