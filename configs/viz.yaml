# Canonical animated-rollout visualization palette (Phase 15B.5 / 15B.8).
# Single source of truth for the fixed legend + colors so every experiment/ablation GIF is
# pixel-consistent. Wildfire-domain semantics mapped onto the canonical class names.
cell_px: 14
fps: 4
classes:
  # order matters: higher class code wins when a cell qualifies for several
  - {code: 0, name: Grass,      color: "#2CC295", desc: "unburned burnable cell"}
  - {code: 1, name: Finished,   color: "#C39BD3", desc: "extinguished / protected cell"}
  - {code: 2, name: Path,       color: "#F5C24B", desc: "agent dispatch route (visited)"}
  - {code: 3, name: Populated,  color: "#0E2A3B", desc: "intact critical asset (petroleum site)"}
  - {code: 4, name: Evacuating, color: "#1F7A9E", desc: "firefighter agent current position"}
  - {code: 5, name: Fire,       color: "#F04A6E", desc: "actively burning cell"}
