# Saudi Arabian Eastern Province — desert wildfire regime.
# ROI: ee.Geometry.Rectangle([45.5, 23.5, 50.5, 28.5])
region:
  name: saudi
  dir: saudi_eastern_province
  grid_size: 32

# Saudi desert domain model (Phase 15): sparse fuel => less spread; more frequent, more
# random ignitions; and a petroleum-asset criticality penalty. These are the CANONICAL Saudi
# dynamics — mirrored into configs/experiment/multiseed.yaml for the reported retrain.
env:
  spread_scale: 0.5        # sparse desert fuel -> reduced spread
  ignition_rate: 0.05      # per-step prob. of a new stochastic ignition (more frequent)
  n_ignition_points: 6     # more, more-random initial fires
  ignition_intensity: 1.0
  randomize_ignition: true
  criticality_weight: 2.0
  criticality_path: data/saudi_eastern_province/grids/32x32/criticality.npy
