# Configuration for Phase 5 Ablation Experiments
#
# Ablation Baselines:
#   1. Pure NearestFire: Standard deterministic routing without RL coordination.
#   2. Static Quadrant Partitioning: Fixed quadrant targets per agent.
#   3. Random Territory Assignment: Agent quadrant targets randomized each step.
#   4. Routing-Only: Navigation without spatial quadrant boundaries (global targeting).
#   5. Full Hybrid PPO: RL-learned quadrant target sector coordination.

experiment_name: phase5_ablation

env:
  grid_size: 32
  max_steps: 200
  reward_mode: normalized
  routing_strategy: nearest_fire
  reward_v3:
    enabled: true
    spread_reduction_weight: 5.0
    frontier_blocking_weight: 1.0
    coverage_weight: 2.0
    overlap_penalty: -0.05
    containment_stability_weight: 1.0
