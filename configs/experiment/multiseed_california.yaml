# Multi-seed PPO training + evaluation for California.
#   wildfire-rl train --config configs/experiment/multiseed_california.yaml
experiment_name: multiseed_california
seeds: [0, 1, 2, 3, 4]

region:
  name: california
  dir: california
  grid_size: 32

env:
  max_steps: 200
  reward_mode: raw
  # Randomized ignition each reset => training samples a scenario distribution and
  # evaluation (offset seeds) samples a disjoint held-out set. No train/test leakage.
  randomize_ignition: true
  n_ignition_points: 3
  ignition_intensity: 1.0
  # California baseline dynamics (no desert specialization) — mirrors configs/region/california.yaml.
  spread_scale: 1.0
  ignition_rate: 0.0
  criticality_weight: 0.0

ppo:
  total_timesteps: 100000
  batch_size: 256
  cnn_pooling: true

eval:
  n_episodes: 50
  base_seed: 0
  scenario_seed_offset: 100000

metrics:
  burned_threshold: 0.5
