# Full symmetric cross-region transfer matrix (Saudi <-> California, both directions).
#   wildfire-rl transfer --config configs/experiment/transfer.yaml
# Fixes the original asymmetry (California->Saudi was never evaluated) and the
# hardcoded result rows. One metric definition, one RNG regime, every cell computed.
experiment_name: transfer

regions:
  - name: saudi
    dir: saudi_eastern_province
    grid_size: 32
  - name: california
    dir: california
    grid_size: 32

env:
  max_steps: 200
  reward_mode: raw          # consider "normalized" for fair cross-region comparison

eval:
  n_episodes: 20
  base_seed: 0
  deterministic: true

metrics:
  burned_threshold: 0.5
