# MAPPO training config for California
region: california
algo: mappo
num_agents: 3
crop_size: 9
coordination_penalty: 0.1
max_steps: 150
total_steps: 50000
n_steps: 1024
batch_size: 64
ppo_epochs: 4
clip_eps: 0.2
gamma: 0.99
gae_lambda: 0.95
lr_actor: 0.0003
lr_critic: 0.001
seed: 42
data_dir: data/cell2fire
