name: CI

on:
  push:
    branches: [main, v2-cell2fire]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff==0.4.9 black==24.4.2
      - name: Ruff
        run: ruff check src tests scripts
      - name: Black (check)
        run: black --check src tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q --cov=wildfire_marl --cov-report=term-missing

  install-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Clean install from pyproject
        run: |
          pip install .
          python -c "import wildfire_marl; print('version', wildfire_marl.__version__)"

  large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard against large files in the tree
        run: |
          big=$(find . -type f -not -path './.git/*' -size +50M)
          if [ -n "$big" ]; then
            echo "ERROR: files >50MB committed:"; echo "$big"; exit 1
          fi
          echo "OK: no file exceeds 50MB."

  validate:
    # Scientific-integrity gates on the ported V2 core: determinism, tensor validity,
    # seed integrity, and the significance test surface. A red job blocks merge.
    # Later phases extend this job (landscape validity, effective-method gate,
    # report<->CSV consistency, CI-sized MARL smoke) per REMEDIATION_PLAN_V2.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Determinism (seeding reproducible)
        run: |
          python -c "from wildfire_marl.reproducibility.seeding import set_global_seed; import numpy as np; set_global_seed(0); a=np.random.rand(5); set_global_seed(0); b=np.random.rand(5); assert (a==b).all(), 'seeding not reproducible'; print('determinism OK')"
      - name: Tensor validity (committed sample tensor)
        run: python -m wildfire_marl.reproducibility.validate_tensors
      - name: Seed integrity (checkpoints/manifest + registered eval CSVs)
        run: python -m wildfire_marl.reproducibility.check_seed_integrity
      - name: Significance artifacts (ported statistical core)
        run: pytest tests/test_significance.py tests/test_metrics.py -q
