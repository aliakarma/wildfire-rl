name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff==0.4.9 black==24.4.2
      - name: Ruff
        run: ruff check src tests scripts
      - name: Black (check)
        run: black --check src tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q --cov=wildfire_rl --cov-report=term-missing
      - name: CLI smoke
        run: wildfire-rl info --set seed=1

  install-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Clean install from pyproject
        run: |
          pip install .
          python -c "import wildfire_rl; print('version', wildfire_rl.__version__)"

  large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard against large files in the tree
        run: |
          big=$(find . -type f -not -path './.git/*' -size +50M)
          if [ -n "$big" ]; then
            echo "ERROR: files >50MB committed:"; echo "$big"; exit 1
          fi
          echo "OK: no file exceeds 50MB."
