name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff==0.4.9 black==24.4.2
      - name: Ruff
        run: ruff check src tests scripts
      - name: Black (check)
        run: black --check src tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q --cov=wildfire_rl --cov-report=term-missing
      - name: CLI smoke
        run: wildfire-rl info --set seed=1

  install-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Clean install from pyproject
        run: |
          pip install .
          python -c "import wildfire_rl; print('version', wildfire_rl.__version__)"

  large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard against large files in the tree
        run: |
          big=$(find . -type f -not -path './.git/*' -size +50M)
          if [ -n "$big" ]; then
            echo "ERROR: files >50MB committed:"; echo "$big"; exit 1
          fi
          echo "OK: no file exceeds 50MB."

  validate:
    # Scientific-integrity gates: determinism, seed integrity, tensor validity,
    # the effective-method gate, and report<->CSV consistency. A red job blocks merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Determinism (seeding reproducible)
        run: |
          python -c "from wildfire_rl.seeding import set_global_seed; import numpy as np; set_global_seed(0); a=np.random.rand(5); set_global_seed(0); b=np.random.rand(5); assert (a==b).all(), 'seeding not reproducible'; print('determinism OK')"
      - name: Tensor validity (committed sample tensor)
        run: python scripts/validate_tensors.py
      - name: Seed integrity (checkpoints/manifest + committed CSVs)
        run: python scripts/check_seed_integrity.py
      - name: Effective-method gate (committed eval CSVs)
        run: python scripts/validate_learning_gate.py
      - name: Report <-> CSV consistency + significance artifacts
        run: pytest tests/test_report_consistency.py tests/test_significance.py -q
      - name: CI-sized learning smoke (best-effort; region data not committed to CI)
        continue-on-error: true
        run: |
          if [ -f data/saudi_eastern_province/grids/32x32/state_tensor.npy ]; then
            python scripts/train.py --set ppo.total_timesteps=2000 seeds=[0,1] region.dir=saudi_eastern_province region.name=saudi
            python scripts/check_seed_integrity.py
          else
            echo "region tensor absent in CI checkout - skipping learning smoke (see docs/reproducibility.md)"
          fi
