# Conda environment for full reproducibility, including the geospatial stack
# (rasterio/GDAL/proj), which is painful to install via pip on Windows.
#
#   conda env create -f environment.yml
#   conda activate wildfire-rl
#   pip install -e .
name: wildfire-rl
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  # --- geospatial (conda-forge handles the GDAL/PROJ binary mess) ---
  - rasterio=1.3.10
  - rioxarray=0.15.5
  - xarray=2024.6.0
  - netcdf4=1.7.1
  - scikit-image=0.24.0
  # --- scientific core ---
  - numpy=1.26.4
  - pandas=2.2.2
  - matplotlib=3.8.4
  - pyyaml=6.0.1
  - tqdm=4.66.4
  # --- the rest via pip (RL stack + EE/CDS clients + editable install) ---
  - pip:
      - gymnasium==0.29.1
      - stable-baselines3==2.3.2
      - torch==2.3.1
      - omegaconf==2.3.0
      - cdsapi==0.7.0
      - earthengine-api==0.1.408
      - geemap==0.32.1
      - -e .
